name: Publish Extension

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: W0 checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install development dependencies
        run: npm ci

      - name: Run static, unit, package-content, and secret gates
        run: npm run check:w0

      - name: Run extension-host smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:extension-host

      - name: Run extension-host smoke
        if: runner.os != 'Linux'
        run: npm run test:extension-host

  publish:
    name: Publish to marketplaces
    runs-on: ubuntu-latest
    needs: test
    env:
      # OPEN_VSX_TOKEN 保留在 job 级，供 Open VSX step 的 if 条件判断；实际传给命令时用 step 级 env。
      OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install publishers
        run: npm install --global @vscode/vsce ovsx

      - name: Inspect package contents
        run: vsce ls --no-dependencies

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: vsce publish --skip-duplicate

      - name: Publish to Open VSX
        if: ${{ env.OPEN_VSX_TOKEN != '' }}
        continue-on-error: true
        env:
          OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
        run: ovsx publish --skip-duplicate
